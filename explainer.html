<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETRA — how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C09; --ink:#EEF3EC; --dim:#8A9A87; --line:#1E2A20;
  --leaf:#63C24A; --fire:#F0663C; --flood:#4FA3DE; --frost:#8FD0F0;
  --land:#E0A63A; --poll:#B98FD8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--ink);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
.shell{width:100%;max-width:1180px}

.frame{position:relative;width:100%;aspect-ratio:16/9;background:var(--bg);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.frame svg{position:absolute;inset:0;width:100%;height:100%}

/* narration overlay */
.narr{
  position:absolute;left:0;right:0;bottom:0;padding:26px 44px 30px;
  background:linear-gradient(0deg,rgba(6,10,7,.94) 0%,rgba(6,10,7,.72) 55%,transparent 100%);
  pointer-events:none;
}
.chap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--leaf);margin-bottom:7px;text-transform:uppercase}
.head{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
.sub{font-size:16px;color:#BACBB6;font-weight:300;line-height:1.5;max-width:68ch}
.narr>*{opacity:0;transform:translateY(9px);transition:opacity .5s ease,transform .5s ease}
.narr.in>*{opacity:1;transform:none}
.narr.in .head{transition-delay:.08s}
.narr.in .sub{transition-delay:.16s}

/* progress */
.bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.07)}
.bar i{display:block;height:100%;width:0;background:var(--leaf)}

/* controls */
.ctl{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
button{
  font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);
  background:#0E150F;color:var(--ink);padding:8px 16px;border-radius:7px;transition:border-color .15s,background .15s;
}
button:hover{border-color:var(--leaf);background:#121B13}
button.main{background:var(--leaf);color:#07110A;border-color:var(--leaf);font-weight:600;min-width:96px}
button.main:hover{background:#71D257}
.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.dot{width:22px;height:5px;border-radius:3px;background:#1E2A20;cursor:pointer;border:none;padding:0;transition:background .2s}
.dot:hover{background:#31422F}
.dot.on{background:var(--leaf)}
.time{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--dim)}

.tip{margin-top:14px;font-size:13px;color:var(--dim);line-height:1.6;max-width:80ch}
.tip b{color:var(--ink);font-weight:500}
@media(max-width:760px){
  .head{font-size:20px} .sub{font-size:13.5px} .narr{padding:16px 20px 20px}
  .chap{font-size:9.5px}
}
</style>
</head>

<script>
(function(){
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const clamp01=v=>v<0?0:v>1?1:v;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- scene definitions ---------------- */
const SC=[
 {id:'s1',d:17,chap:'The problem',
  h:'At 3:40 in the morning, nobody is awake.',
  s:'Frost is settling over a field in Hassan district. By sunrise the crop will be gone. There is no mobile signal here — so no app, no SMS and no cloud service can reach this farm. Most of India\u2019s warning systems assume a network that these farms do not have.'},

 {id:'s2',d:17,chap:'The sensor node',
  h:'One solar-powered box, seven senses.',
  s:'Temperature and humidity, smoke, flame, air quality, water level and ground vibration — on a single node that runs on a small panel and a battery, and needs no maintenance visit.'},

 {id:'s3',d:15,chap:'Sensing',
  h:'It takes a reading every two seconds.',
  s:'All seven values are packed into one short line of text — thirty-eight bytes. Small enough to travel a long way on very little power.'},

 {id:'s4',d:17,chap:'The link',
  h:'It sends that line by radio, not by internet.',
  s:'LoRa at 433 megahertz carries the reading to a gateway box in the farmhouse. No SIM card, no mobile tower, no internet connection is involved at any point in this step.'},

 {id:'s5',d:26,chap:'The decision',
  h:'The gateway does not trust one sensor.',
  s:'Each reading becomes a score between zero and one. Flame carries half the weight, smoke a quarter, rising temperature and falling humidity the rest. Multiply, add, and you get a confidence figure — not a yes or a no.'},

 {id:'s6',d:17,chap:'Five hazards',
  h:'The same arithmetic runs five times, every cycle.',
  s:'Fire, flood, frost, landslide and pollution each get their own weights and their own score. Whichever crosses forty-five per cent first is the one that raises the alarm.'},

 {id:'s7',d:18,chap:'The alert',
  h:'Then three things happen at once.',
  s:'The screen names the hazard, the buzzer sounds, and a voice says it aloud in the local language — so it works for someone who cannot read, at three in the morning, with no phone in the house. The event is written to a memory card with the exact time.'},

 {id:'s8',d:16,chap:'The cloud',
  h:'If a signal appears, it syncs. If not, nothing changes.',
  s:'When any WiFi is within reach the gateway uploads to a live dashboard so officials can see the district at a glance. When there is no signal, every alert still fires exactly as before.'},

 {id:'s9',d:17,chap:'Scale',
  h:'The same box, repeated.',
  s:'One node protects one farm. Add nodes and the gateway watches a village. Add gateways and a district disaster office has a live map — built from identical hardware, with no redesign at any step.'},

 {id:'s10',d:12,chap:'',
  h:'',s:''},
];
const TOTAL=SC.reduce((a,x)=>a+x.d,0);

/* ---------------- build repeated geometry ---------------- */
// S1 stars + crops
for(let i=0;i<90;i++) $('s1stars').appendChild(mk('circle',{cx:(Math.random()*1280).toFixed(0),cy:(Math.random()*430).toFixed(0),r:(Math.random()*1.2+.3).toFixed(2),fill:'#D6E4F2',opacity:(Math.random()*.6+.2).toFixed(2)}));
const s1crops=[];
for(let i=0;i<70;i++){
  const x=10+i*18.4, y=600+(i%3)*22, h=20+Math.random()*14;
  const p=mk('path',{stroke:'#14301C','stroke-width':2.4,fill:'none','stroke-linecap':'round'});
  $('s1crops').appendChild(p); s1crops.push({el:p,x,y,h,ph:Math.random()*6.3});
}

// S2 sensor pips + labels
const SENSORS=[
 {n:'Temperature & humidity',x:372,y:300},{n:'Smoke',x:452,y:300},
 {n:'Flame',x:372,y:360},{n:'Air quality',x:452,y:360},
 {n:'Water level',x:372,y:420},{n:'Ground vibration',x:452,y:420},
 {n:'Solar + battery',x:412,y:466},
];
const s2p=[];
SENSORS.forEach((s,i)=>{
  const c=mk('circle',{cx:s.x,cy:s.y,r:13,fill:'#0E1A11',stroke:'#2E4030','stroke-width':2});
  $('s2pips').appendChild(c);
  const lx = s.x<412 ? 300 : 580, anc = s.x<412?'end':'start';
  const t=mk('text',{x:lx,y:s.y+5,'text-anchor':anc,'font-family':'Inter','font-size':16,fill:'#BACBB6',opacity:0});
  t.textContent=s.n; $('s2labels').appendChild(t);
  const ln=mk('line',{x1:s.x<412?s.x-16:s.x+16,y1:s.y,x2:s.x<412?lx+10:lx-10,y2:s.y,stroke:'#2E4030','stroke-width':1.4,opacity:0});
  $('s2labels').appendChild(ln);
  s2p.push({c,t,ln});
});

// S3 rows
const S3=[['Temperature','24.6','°C'],['Humidity','71.4','%'],['Smoke','2790',''],['Flame','clear',''],['Air quality','150',''],['Water','92','cm'],['Vibration','0','/60s']];
const s3r=[];
S3.forEach((r,i)=>{
  const y=210+i*36;
  const a=mk('text',{x:90,y,'font-family':'Inter','font-size':17,fill:'#8A9A87'}); a.textContent=r[0];
  const b=mk('text',{x:470,y,'text-anchor':'end','font-family':'IBM Plex Mono','font-size':17,fill:'#EEF3EC'});
  const c=mk('text',{x:480,y,'font-family':'IBM Plex Mono','font-size':13,fill:'#5C6B5A'}); c.textContent=r[2];
  $('s3rows').append(a,b,c); s3r.push({b,base:r[1]});
});

// S5 rows
const S5=[
 {n:'Flame detected',v:1.00,w:0.50,c:'#F0663C'},
 {n:'Smoke above normal',v:0.84,w:0.25,c:'#E0A63A'},
 {n:'Temperature rising',v:0.56,w:0.15,c:'#B98FD8'},
 {n:'Humidity falling',v:0.22,w:0.10,c:'#4FA3DE'},
];
const s5r=[];
S5.forEach((r,i)=>{
  const y=210+i*62;
  const nm=mk('text',{x:90,y:y+18,'font-family':'Inter','font-size':17,fill:'#BACBB6'}); nm.textContent=r.n;
  const tr=mk('rect',{x:330,y:y,width:250,height:22,rx:5,fill:'#111A13'});
  const fl=mk('rect',{x:330,y:y,width:0,height:22,rx:5,fill:r.c});
  const sv=mk('text',{x:600,y:y+17,'font-family':'IBM Plex Mono','font-size':16,fill:'#EEF3EC',opacity:0});
  const wt=mk('text',{x:700,y:y+17,'font-family':'IBM Plex Mono','font-size':16,fill:'#5C6B5A',opacity:0}); wt.textContent='× '+r.w.toFixed(2);
  const pr=mk('text',{x:1130,y:y+17,'text-anchor':'end','font-family':'IBM Plex Mono','font-size':18,fill:r.c,opacity:0});
  $('s5rows').append(nm,tr,fl,sv,wt,pr);
  s5r.push({fl,sv,wt,pr,...r});
});

// S6 rows
const S6=[
 {n:'Fire',v:81,c:'#F0663C'},{n:'Flood',v:14,c:'#4FA3DE'},{n:'Frost',v:8,c:'#8FD0F0'},
 {n:'Landslide',v:5,c:'#E0A63A'},{n:'Pollution',v:26,c:'#B98FD8'},
];
const s6r=[];
S6.forEach((r,i)=>{
  const y=220+i*78;
  const nm=mk('text',{x:90,y:y+26,'font-family':'Inter','font-size':20,fill:'#BACBB6'}); nm.textContent=r.n;
  const tr=mk('rect',{x:310,y:y,width:720,height:34,rx:7,fill:'#111A13'});
  const fl=mk('rect',{x:310,y:y,width:0,height:34,rx:7,fill:r.c});
  const pc=mk('text',{x:1060,y:y+26,'font-family':'IBM Plex Mono','font-size':21,fill:r.c,opacity:0});
  $('s6rows').append(nm,tr,fl,pc);
  s6r.push({fl,pc,...r});
});

// S8 dashboard bars
const s8b=[];
[['Fire',81,'#F0663C'],['Flood',14,'#4FA3DE'],['Frost',8,'#8FD0F0'],['Landslide',5,'#E0A63A']].forEach((r,i)=>{
  const y=300+i*46;
  const nm=mk('text',{x:570,y:y+14,'font-family':'Inter','font-size':14,fill:'#8A9A87'}); nm.textContent=r[0];
  const tr=mk('rect',{x:700,y:y,width:400,height:18,rx:4,fill:'#111A13'});
  const fl=mk('rect',{x:700,y:y,width:0,height:18,rx:4,fill:r[2]});
  $('s8bars').append(nm,tr,fl); s8b.push({fl,v:r[1]});
});

// S9 nodes — farm → village → district
const s9n=[];
for(let i=0;i<42;i++){
  const g=mk('g',{opacity:0});
  g.appendChild(mk('circle',{r:9,fill:'#63C24A'}));
  g.appendChild(mk('circle',{r:9,fill:'none',stroke:'#63C24A','stroke-width':1.5,opacity:.35}));
  $('s9nodes').appendChild(g);
  s9n.push({g,x:0,y:0});
}

/* ---------------- playback ---------------- */
let t=0, playing=true, last=performance.now();
const dots=SC.map((s,i)=>{
  const b=document.createElement('button'); b.className='dot'; b.title=s.chap||'End';
  b.onclick=()=>{ t=SC.slice(0,i).reduce((a,x)=>a+x.d,0)+0.01; };
  $('dots').appendChild(b); return b;
});
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'Pause':'Play'; };
$('restart').onclick=()=>{ t=0; playing=true; $('play').textContent='Pause'; };
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
$('time').textContent='0:00 / '+fmt(TOTAL);

let curIdx=-1;
function setNarr(i){
  const s=SC[i];
  $('narr').classList.remove('in');
  setTimeout(()=>{
    $('chap').textContent=s.chap; $('head').textContent=s.h; $('sub').textContent=s.s;
    if(s.h) $('narr').classList.add('in');
  },180);
}

function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(playing){ t+=dt; if(t>=TOTAL) t=0; }

  // which scene
  let acc=0, idx=0, local=0;
  for(let i=0;i<SC.length;i++){
    if(t < acc+SC[i].d){ idx=i; local=(t-acc)/SC[i].d; break; }
    acc+=SC[i].d;
  }
  if(idx!==curIdx){ curIdx=idx; setNarr(idx); dots.forEach((d,i)=>d.classList.toggle('on',i===idx)); }

  SC.forEach((s,i)=>{
    const g=$(s.id);
    let o=0;
    if(i===idx) o = clamp01(local/0.06) * clamp01((1-local)/0.06);
    g.setAttribute('opacity',o.toFixed(3));
  });

  const T=now/1000, p=local, e=ease(clamp01(p));

  /* S1 */
  if(idx===0){
    s1crops.forEach(c=>{
      const sw=Math.sin(T*.8+c.ph)*2.2;
      c.el.setAttribute('d',`M${c.x} ${c.y} Q${c.x+sw*.5} ${c.y-c.h*.6} ${c.x+sw} ${c.y-c.h}`);
      c.el.setAttribute('stroke', p>.45 ? '#3C5E52' : '#14301C');
    });
    $('s1frost').setAttribute('opacity',(clamp01((p-.4)/.45)*.12).toFixed(3));
    const fo=clamp01((p-.3)/.2);
    $('s1temp').setAttribute('opacity',fo); $('s1tempL').setAttribute('opacity',fo*.9);
    $('s1temp').textContent = (6.2 - clamp01((p-.3)/.55)*4.8).toFixed(1)+'°C';
    $('s1win').setAttribute('fill', (T%3)<1.5 ? '#2A2418' : '#221E14');
  }

  /* S2 */
  if(idx===1){
    s2p.forEach((s,i)=>{
      const on=clamp01((p-(0.12+i*0.095))/0.07);
      s.c.setAttribute('fill', on>.5 ? '#63C24A' : '#0E1A11');
      s.c.setAttribute('r',(13+on*3*(Math.sin(T*4+i)*0.5+0.5)).toFixed(1));
      s.t.setAttribute('opacity',on.toFixed(2)); s.ln.setAttribute('opacity',(on*.6).toFixed(2));
    });
  }

  /* S3 */
  if(idx===2){
    const tick=Math.floor(T*0.7);
    s3r.forEach((r,i)=>{
      let v=parseFloat(r.base);
      if(isNaN(v)) { r.b.textContent=r.base; return; }
      const j=Math.sin(tick*2.3+i*1.7)*(v>1000?9:v>60?.5:.25);
      r.b.textContent = (v>1000? Math.round(v+j) : (v+j).toFixed(1));
    });
    const on=clamp01((p-.35)/.15);
    $('s3packet').setAttribute('opacity',on);
    $('s3packet').setAttribute('fill', (T*2%2)<1 ? '#63C24A':'#4FA33C');
  }

  /* S4 */
  if(idx===3){
    const k=(T*0.55)%1;
    const px=lerp(205,1160,k), py=286-Math.sin(k*Math.PI)*86;
    $('s4pkt').setAttribute('cx',px.toFixed(1)); $('s4pkt').setAttribute('cy',py.toFixed(1));
    $('s4pkt').setAttribute('opacity',(Math.sin(k*Math.PI)).toFixed(2));
    $('s4none').setAttribute('opacity',clamp01((p-.42)/.2).toFixed(2));
  }

  /* S5 — the hero */
  if(idx===4){
    let run=0;
    s5r.forEach((r,i)=>{
      const st=0.10+i*0.115;
      const a=clamp01((p-st)/0.085);          // bar fills
      const b=clamp01((p-st-0.05)/0.07);      // value + weight appear
      r.fl.setAttribute('width',(250*r.v*ease(a)).toFixed(1));
      r.sv.setAttribute('opacity',b.toFixed(2));
      r.sv.textContent=(r.v*ease(a)).toFixed(2);
      r.wt.setAttribute('opacity',b.toFixed(2));
      r.pr.setAttribute('opacity',b.toFixed(2));
      r.pr.textContent='= '+(r.v*r.w*ease(a)).toFixed(3);
      if(b>0.9) run+=r.v*r.w;
    });
    const so=clamp01((p-.62)/.09);
    $('s5rule').setAttribute('opacity',so.toFixed(2));
    $('s5sum').setAttribute('opacity',so.toFixed(2));
    $('s5sumL').setAttribute('opacity',so.toFixed(2));
    $('s5sum').textContent=(run*ease(so)).toFixed(2);
    $('s5sumL').textContent='= '+Math.round(run*ease(so)*100)+'% fire confidence';
    const to=clamp01((p-.76)/.10);
    $('s5th').setAttribute('opacity',to.toFixed(2));
    $('s5thFill').setAttribute('width',(1096*0.81*ease(to)).toFixed(1));
  }

  /* S6 */
  if(idx===5){
    s6r.forEach((r,i)=>{
      const a=ease(clamp01((p-(0.12+i*0.085))/0.16));
      r.fl.setAttribute('width',(720*r.v/100*a).toFixed(1));
      r.pc.setAttribute('opacity',a.toFixed(2));
      r.pc.textContent=Math.round(r.v*a)+'%';
      if(r.v>45 && a>.9) r.fl.setAttribute('opacity',(0.75+Math.sin(T*6)*0.25).toFixed(2));
    });
  }

  /* S7 */
  if(idx===6){
    const on=clamp01((p-.08)/.12);
    $('s7glow').setAttribute('opacity',(on*(0.5+Math.sin(T*5)*0.28)).toFixed(2));
    const bz=Math.sin(T*9)*0.5+0.5;
    $('s7buzz').setAttribute('opacity',(on*bz).toFixed(2));
    $('s7buzz').setAttribute('r',(22+bz*16).toFixed(1));
    const sk=(T*0.8)%1;
    $('s7spk').setAttribute('opacity',(on*(1-sk)*0.85).toFixed(2));
    $('s7spk').setAttribute('r',(22+sk*26).toFixed(1));
    $('s7kan').setAttribute('opacity',clamp01((p-.35)/.15).toFixed(2));
    $('s7log').setAttribute('opacity',clamp01((p-.58)/.14).toFixed(2));
    const fl=(T*3%1)<0.5;
    $('s7l2').setAttribute('opacity', on>.5 ? (fl?1:0.45) : 0);
  }

  /* S8 */
  if(idx===7){
    const online = p>0.34 && p<0.80;
    $('s8wifi').setAttribute('opacity', online ? (0.6+Math.sin(T*4)*0.35).toFixed(2) : 0.15);
    $('s8st').textContent = online ? 'connected — syncing' : 'no signal — still alerting locally';
    $('s8st').setAttribute('fill', online ? '#8FD0F0' : '#5C6B5A');
    $('s8arc').setAttribute('opacity', online?0.75:0);
    s8b.forEach((b,i)=>{
      const a = online ? ease(clamp01((p-0.38-i*0.04)/0.12)) : 0;
      b.fl.setAttribute('width',(400*b.v/100*a).toFixed(1));
    });
  }

  /* S9 */
  if(idx===8){
    const stage = p<0.30?0 : p<0.62?1 : 2;
    const cap=['one farm','one village','one district'][stage];
    $('s9cap').textContent=cap;
    $('s9cap').setAttribute('opacity',clamp01((p-.06)/.08).toFixed(2));
    s9n.forEach((n,i)=>{
      let show=false,x=0,y=0;
      if(stage===0){ show=i<1; x=640; y=330; }
      else if(stage===1){ show=i<7; const a=i/7*6.283; x=640+Math.cos(a)*120; y=330+Math.sin(a)*100; if(i===0){x=640;y=330;} }
      else { show=true; const c=i%7, r=Math.floor(i/7); x=300+c*113+(r%2)*56; y=200+r*54; }
      const tt=ease(clamp01((p-(stage===2?0.62:stage===1?0.30:0.06))/0.22));
      n.g.setAttribute('opacity', show? tt.toFixed(2) : 0);
      n.g.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(0.5+tt*0.5).toFixed(2)})`);
      const ring=n.g.children[1];
      const ph=(T*0.8+i*0.16)%1;
      ring.setAttribute('r',(9+ph*22).toFixed(1));
      ring.setAttribute('opacity',((1-ph)*0.4*(show?1:0)).toFixed(2));
    });
  }

  $('prog').style.width=(t/TOTAL*100)+'%';
  $('time').textContent=fmt(t)+' / '+fmt(TOTAL);
  requestAnimationFrame(loop);
}
setNarr(0); dots[0].classList.add('on');
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
